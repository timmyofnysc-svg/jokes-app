<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joke Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
    <link
      rel="shortcut icon"
      href="images/favicon-32x32.png"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-slate-900 via-gray-900 to-black min-h-screen flex items-center justify-center px-4"
  >
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-6">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white">
          😂 Joke Generator
        </h1>
        <p class="text-gray-400 text-sm">Tap the dice. Laugh or cry.</p>
      </div>

      <div
        class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl"
      >
        <p
          id="id"
          class="text-green-400 text-xs uppercase tracking-widest mb-4 text-center"
        ></p>

        <p
          id="joke"
          class="text-white text-lg sm:text-xl font-semibold leading-relaxed text-center min-h-[100px] flex items-center justify-center px-2"
        ></p>

        <!--DIVIDER -->
        <div class="flex items-center justify-center my-6">
          <div class="h-[1px] bg-gray-600 w-1/4"></div>
          <div class="mx-3 text-green-400 text-lg">🎲</div>
          <div class="h-[1px] bg-gray-600 w-1/4"></div>
        </div>

        <!-- Dice Button -->
        <div class="flex justify-center">
          <button
            id="btn"
            class="bg-[#52ffa8] p-4 rounded-full absolute -bottom-6 opacity-75 hover:opacity-100"
          >
            <img
              src="https://res.cloudinary.com/dnfk8jqfd/image/upload/v1777743677/icon-dice_shws8j.svg"
              alt="dice-img"
            />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
